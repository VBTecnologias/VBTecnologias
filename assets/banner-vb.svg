<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">VB Tecnologias — Soluções Web &amp; Suporte</title>
<desc id="desc">Banner escuro com detalhes tecnológicos em laranja e a marca VB Tecnologias.</desc>
<defs>
