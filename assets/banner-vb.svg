    <stop offset="0" stop-color="#ffbd36"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#ff4d00"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#ff6a00" stop-opacity=".24"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#ff7a00" opacity=".42"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
